    <text x="487" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" fill="#94a3b8">*TypeScript appears in current repository language stats.</text><path d="M487 472H1118" stroke="#cbd5e1"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11"><rect x="487" y="492" width="117" height="29" rx="8" fill="#7c3aed" fill-opacity=".08" stroke="#8b5cf6" stroke-opacity=".65"/><text x="545.5" y="510" text-anchor="middle" fill="#6d28d9">AI / ML</text><rect x="614" y="492" width="112" height="29" rx="8" fill="#0891b2" fill-opacity=".08" stroke="#0891b2" stroke-opacity=".65"/><text x="670" y="510" text-anchor="middle" fill="#0e7490">DSA</text><rect x="736" y="492" width="170" height="29" rx="8" fill="#059669" fill-opacity=".08" stroke="#059669" stroke-opacity=".65"/><text x="821" y="510" text-anchor="middle" fill="#047857">OPEN SOURCE</text></g>
