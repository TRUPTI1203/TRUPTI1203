    <ellipse cx="220" cy="215" rx="330" ry="270" fill="url(#glow)"/><ellipse cx="1030" cy="470" rx="300" ry="250" fill="url(#glow)" opacity=".65"/>
    <path d="M0 95H1180" stroke="#94a3b8" stroke-opacity=".28"/><rect x="12" y="12" width="1156" height="586" rx="24" fill="none" stroke="#cbd5e1"/>
