<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Trupti Mayee Suara — engineering profile</title>
  <desc id="desc">A light, terminal-inspired profile banner for Trupti, a Computer Science student at PMEC and aspiring software development engineer, exploring AI and machine learning and building a sign language recognition project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f4f8ff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset=".55" stop-color="#0891b2"/><stop offset="1" stop-color="#059669"/><animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".96"/><stop offset="1" stop-color="#f1f5f9" stop-opacity=".94"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".12"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#64748b" stroke-opacity=".10" stroke-width="1"/></pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#0891b2" fill-opacity=".52"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#64748b" flood-opacity=".14"/></filter>
    <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
