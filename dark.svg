<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-labelledby="title desc">
  <title id="title">Trupti Mayee Suara — engineering profile</title>
  <desc id="desc">A dark, terminal-inspired profile banner for Trupti, a Computer Science student at PMEC and aspiring software development engineer, exploring AI and machine learning and building a sign language recognition project.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030712"/><stop offset=".55" stop-color="#081326"/><stop offset="1" stop-color="#10102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#34d399"/>
      <animate attributeName="x1" values="0;0.2;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172238" stop-opacity=".88"/><stop offset="1" stop-color="#0b1220" stop-opacity=".82"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".22"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#67e8f9" fill-opacity=".58"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000814" flood-opacity=".4"/>
    </filter>
    <clipPath id="frame"><rect x="12" y="12" width="1156" height="586" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1180" height="610" rx="24" fill="url(#bg)"/>
    <rect width="1180" height="610" fill="url(#grid)"/>
    <ellipse cx="220" cy="215" rx="330" ry="270" fill="url(#glow)"/>
    <ellipse cx="1030" cy="470" rx="300" ry="250" fill="url(#glow)" opacity=".65"/>
    <path d="M0 95H1180" stroke="#94a3b8" stroke-opacity=".14"/>
    <rect x="12" y="12" width="1156" height="586" rx="24" fill="none" stroke="#94a3b8" stroke-opacity=".34"/>
    <!-- Editor chrome -->
    <rect x="28" y="27" width="1124" height="52" rx="12" fill="#0b1220" fill-opacity=".9" stroke="#334155" stroke-opacity=".7"/>
    <circle cx="52" cy="53" r="5.5" fill="#fb7185"/><circle cx="72" cy="53" r="5.5" fill="#fbbf24"/><circle cx="92" cy="53" r="5.5" fill="#34d399"/>
    <text x="116" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="14" fill="#94a3b8">trupti@profile:~</text>
    <text x="1090" y="57" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2" fill="#6ee7b7">● ONLINE</text>
    <!-- Left visual panel -->
    <rect x="32" y="101" width="405" height="465" rx="18" fill="url(#panel)" stroke="#64748b" stroke-opacity=".4" filter="url(#shadow)"/>
    <rect x="32" y="101" width="405" height="3" rx="2" fill="url(#accent)"/>
    <text x="58" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2.3" fill="#67e8f9">VISUAL.MAP</text>
    <text x="410" y="137" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" fill="#64748b">FIG. 001</text>
    <!-- Abstract dot-matrix visual, intentionally not a fabricated portrait -->
    <circle cx="234" cy="288" r="119" fill="#0b1324" stroke="#334155" stroke-opacity=".7"/>
    <circle cx="234" cy="288" r="105" fill="url(#dots)" opacity=".65">
      <animate attributeName="opacity" values=".42;.78;.42" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="234" cy="288" r="83" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 7">
      <animateTransform attributeName="transform" type="rotate" from="0 234 288" to="360 234 288" dur="40s" repeatCount="indefinite"/>
    </circle>
    <path d="M164 288H304M234 218V358" stroke="#67e8f9" stroke-opacity=".22" stroke-dasharray="3 7"/>
    <text x="234" y="274" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="17" fill="#a78bfa">BUILD</text>
    <text x="234" y="302" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="17" fill="#e2e8f0">LEARN</text>
    <text x="234" y="330" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="17" fill="#67e8f9">REPEAT</text>
    <path d="M58 431H411" stroke="#334155" stroke-opacity=".8"/>
    <text x="58" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#94a3b8">~/profile $</text>
    <text x="158" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#a7f3d0">build --learn --ship</text>
    <rect x="58" y="480" width="9" height="17" rx="1" fill="#67e8f9">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="80" y="493" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#64748b">Curiosity → code → contribution</text>
    <text x="58" y="535" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#64748b">ENGINEERING / IN PROGRESS</text>
    <!-- Right system panel -->
    <rect x="457" y="101" width="691" height="465" rx="18" fill="url(#panel)" stroke="#64748b" stroke-opacity=".4" filter="url(#shadow)"/>
    <rect x="457" y="101" width="691" height="3" rx="2" fill="url(#accent)"/>
    <text x="487" y="137" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" letter-spacing="2.3" fill="#67e8f9">SYSTEM.INFO</text>
    <text x="1117" y="137" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" fill="#64748b">PROFILE / 01</text>
    <text x="487" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12" fill="#a78bfa">$ ./profile.sh</text>
    <text x="487" y="222" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700" fill="#f8fafc">Trupti Mayee Suara</text>
    <text x="487" y="254" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="600" fill="#67e8f9">Computer Science Student · Aspiring SDE</text>
    <text x="487" y="280" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#94a3b8">PMEC  /  AI·ML exploration  /  Software engineering</text>
    <path d="M487 302H1118" stroke="#475569" stroke-opacity=".65"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="12">
      <text x="487" y="333" fill="#67e8f9">FOCUS</text><text x="602" y="333" fill="#e2e8f0">AI / ML · DSA · Open Source</text>
      <text x="487" y="363" fill="#67e8f9">BUILDING</text><text x="602" y="363" fill="#e2e8f0">Sign Language Recognition</text>
      <text x="487" y="393" fill="#67e8f9">LANGUAGES</text><text x="602" y="393" fill="#e2e8f0">C · Java · Python · JavaScript · TypeScript*</text>
      <text x="487" y="423" fill="#67e8f9">TOOLS</text><text x="602" y="423" fill="#e2e8f0">GitHub · VS Code · Windows Terminal</text>
    </g>
    <text x="487" y="452" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="10" fill="#64748b">*TypeScript appears in current repository language stats.</text>
    <path d="M487 472H1118" stroke="#475569" stroke-opacity=".65"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11">
      <rect x="487" y="492" width="117" height="29" rx="8" fill="#7c3aed" fill-opacity=".13" stroke="#a78bfa" stroke-opacity=".5"/>
      <text x="545.5" y="510" text-anchor="middle" fill="#c4b5fd">AI / ML</text>
      <rect x="614" y="492" width="112" height="29" rx="8" fill="#0891b2" fill-opacity=".13" stroke="#67e8f9" stroke-opacity=".5"/>
      <text x="670" y="510" text-anchor="middle" fill="#a5f3fc">DSA</text>
      <rect x="736" y="492" width="170" height="29" rx="8" fill="#059669" fill-opacity=".13" stroke="#6ee7b7" stroke-opacity=".5"/>
      <text x="821" y="510" text-anchor="middle" fill="#a7f3d0">OPEN SOURCE</text>
    </g>
    <text x="487" y="546" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="11" fill="#94a3b8">STATUS: learning in public, one project at a time.</text>
    <rect x="28" y="582" width="1124" height="2" rx="1" fill="url(#accent)" opacity=".8"/>
  </g>
</svg>